# Kept working for Azure DevOps; the GitHub Actions workflow in .github/workflows/ci.yml does the same.
trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  inputs:
    useGlobalJson: true

- script: dotnet build CB-Libs.slnx -c $(buildConfiguration)
  displayName: Build

- script: dotnet test --solution CB-Libs.slnx -c $(buildConfiguration) --no-build
  displayName: Test

- script: dotnet pack CB-Libs.slnx -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)
  displayName: Pack
