  # Windows adds what Linux cannot: net48 (built and run there only) and CB.Win32Tests.
  build-and-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore CB-Libs.slnx

      - name: Build
        run: dotnet build CB-Libs.slnx --configuration Release --no-restore

      - name: Test & Code Coverage
        shell: bash
        run: |
          status=0
          for dir in *Tests; do
            echo "::group::$dir"
            dotnet test --project "$dir/$dir.csproj" --configuration Release --no-build -- \
              --results-directory "$RUNNER_TEMP/TestResults/$dir" --report-trx --coverage --coverage-output-format cobertura \
              || { echo "::error::Tests failed in $dir"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: ${{ runner.temp }}/TestResults/**/*.trx

