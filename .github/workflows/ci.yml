name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # SDK 11 from global.json; the net10.0 test builds need the .NET 10 runtime next to it.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build CB-Libs.slnx -c Release
      # Windows also builds and runs net48 and the Windows-only tests (CB.Win32Tests). Linux runs everything else;
      # tests that need a packet capture library skip themselves there.
      - name: Test
        shell: bash
        run: |
          for dir in *Tests; do
            if [ "$dir" = "CB.Win32Tests" ] && [ "$RUNNER_OS" != "Windows" ]; then continue; fi
            dotnet test --project "$dir/$dir.csproj" -c Release --no-build
          done

  pack:
    name: pack
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack CB-Libs.slnx -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg
