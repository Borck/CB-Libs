name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Only the Windows job runs here. Woodpecker CI (.woodpecker/) has no Windows agent: it builds, tests and packs on Linux and
# does everything the commented-out jobs below did. Remove the comments of a job to run it on GitHub again.

jobs:
  # A change that only touches documents builds and tests nothing. A path filter on the workflow would leave the
  # required checks "expected" forever and block the merge of every docs-only pull request; a job skipped by `if`
  # reports as skipped, which a required check accepts (same reasoning as IVI-Framework's ci.yml).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find what changed
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to compare with: everything runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "$files"
          code=false
          if echo "$files" | grep -qvE '^docs/|\.md$|^images/'; then code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

