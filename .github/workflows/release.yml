name: Release

# Publishes the CB packages to nuget.org and creates the GitHub release.
#
#   tag v<VersionPrefix>[-<suffix>]   e.g. v1.0.0-preview.2 or v1.0.0. The number must equal VersionPrefix in
#                                     Directory.Build.props; what follows the first '-' is the prerelease suffix, none means
#                                     the release version itself (Directory.Build.props' default suffix is cleared).
#   manual run                        packs and tests what the selected ref would publish; publishes only if asked to.
#
# A published NuGet version cannot be deleted, only unlisted, so the publish step runs in the `nuget-org` environment:
# give that environment required reviewers (Settings -> Environments) and nothing leaves without a person approving it.
# NUGET_API_KEY: a nuget.org API key with push rights on the CB.* packages, stored as a secret of that environment.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      suffix:
        description: 'Prerelease suffix (e.g. preview.2); empty packs the release version'
        required: false
        default: 'preview.1'
      publish:
        description: 'Push the packages to nuget.org (otherwise pack and test only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Test & pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          dotnet-version: 10.0.x

      # The tag is the version consumers see; the assemblies and the packages say VersionPrefix. Two numbers for one
      # release is how a support conversation goes wrong.
      - name: Work out the version
        id: version
        run: |
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            tag_prefix="${tag%%-*}"
            suffix=""
            [ "$tag" != "$tag_prefix" ] && suffix="${tag#*-}"
            if [ "$tag_prefix" != "$prefix" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in Directory.Build.props."
              exit 1
            fi
            publish=true
          else
            suffix="${{ github.event.inputs.suffix }}"
            publish="${{ github.event.inputs.publish }}"
          fi
          version="$prefix${suffix:+-$suffix}"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish=$publish"

      # A release does not ship a package with a known advisory of moderate severity or worse. The audit runs at restore;
      # NU1901-NU1904 are the low/moderate/high/critical advisory warnings, made errors here only.
      - name: Restore dependencies
        run: >
          dotnet restore CB-Libs.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=moderate
          -p:NuGetAuditMode=all
          "-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"

      - name: Build
        run: dotnet build CB-Libs.slnx --configuration Release --no-restore -p:VersionSuffix="${{ steps.version.outputs.suffix }}"

      # Windows-only tests and net48 run in ci.yml's Windows job on the same commit; a tag should point at a commit whose
      # CI is green.
      - name: Test
        shell: bash
        run: |
          status=0
          for dir in *Tests; do
            if [ "$dir" = "CB.Win32Tests" ]; then continue; fi
            dotnet test --project "$dir/$dir.csproj" --configuration Release --no-build || status=1
          done
          exit $status

      - name: Pack
        run: dotnet pack CB-Libs.slnx --configuration Release --no-build --output artifacts -p:VersionSuffix="${{ steps.version.outputs.suffix }}"

      - name: Check every package carries the version
        run: |
          count=$(ls artifacts/*.nupkg | wc -l)
          wrong=$(ls artifacts/*.nupkg | grep -v "\.${{ steps.version.outputs.version }}\.nupkg$" || true)
          echo "$count packages"
          if [ "$count" -eq 0 ] || [ -n "$wrong" ]; then echo "::error::Unexpected package versions: $wrong"; exit 1; fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    needs: pack
    if: needs.pack.outputs.publish == 'true'
    environment: nuget-org
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Require the API key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Set the NUGET_API_KEY secret (a nuget.org key with push rights on the CB.* packages)."
            exit 1
          fi

      # --skip-duplicate: a re-run after a partial failure pushes what is missing. The .snupkg beside each .nupkg goes
      # to the symbol server with it.
      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: CB-Libs ${{ needs.pack.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*.*nupkg
